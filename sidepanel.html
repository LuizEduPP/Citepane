<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Citepane</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <img src="icons/icon-32.png" width="36" height="36" alt="" />
        <div class="brand-text">
          <h1>
            <span class="brand-cite">Cite</span><span class="brand-pane">pane</span>
          </h1>
          <p class="brand-tagline">Grounded AI answers · Browser side panel</p>
        </div>
      </div>
      <div class="top-actions">
        <button type="button" id="copy-btn" class="ghost" data-i18n="uiCopy" hidden>Copy</button>
        <button
          type="button"
          id="settings-btn"
          class="icon-btn"
          data-i18n-aria="uiSettings"
          aria-label="Settings"
          aria-controls="settings-panel"
          aria-expanded="false"
        >
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
            <path
              fill="currentColor"
              d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7.2 7.2 0 0 0-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.48.48 0 0 0-.48.41l-.36 2.54c-.59.24-1.13.55-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87a.48.48 0 0 0 .12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.39 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.48-.41l.36-2.54c.59-.24 1.13-.55 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.49.49 0 0 0-.12-.61l-2.03-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"
            />
          </svg>
        </button>
      </div>
    </header>

    <section id="settings-panel" class="settings-panel" hidden>
      <form id="settings-form">
        <label>
          <span data-i18n="uiBaseUrl">Base URL</span>
          <input id="base-url" name="baseUrl" type="url" required autocomplete="off" />
        </label>
        <label>
          <span data-i18n="uiModel">Model</span>
          <div class="model-row">
            <select id="model" name="model" required></select>
            <button type="button" id="refresh-models" class="ghost" data-i18n="uiRefreshModels">
              Refresh
            </button>
          </div>
        </label>
        <label>
          <span data-i18n="uiApiKey">API key (optional)</span>
          <input id="api-key" name="apiKey" type="password" autocomplete="off" />
        </label>
        <label>
          <span data-i18n="uiResponseLanguage">Response language</span>
          <select id="response-language" name="responseLanguage"></select>
        </label>
        <label>
          <span data-i18n="uiUiLanguage">UI language</span>
          <select id="ui-language" name="uiLanguage"></select>
        </label>
        <label>
          <span data-i18n="uiTheme">Theme</span>
          <select id="theme" name="theme"></select>
        </label>
        <button type="submit" data-i18n="uiSave">Save</button>
        <p id="settings-feedback" class="muted" hidden></p>
      </form>
    </section>

    <main>
      <p id="idle" class="muted" data-i18n="uiIdle"></p>

      <section id="job" hidden>
        <p id="action-label" class="eyebrow"></p>
        <h2 data-i18n="uiSelection">Selection</h2>
        <pre id="selection" class="block"></pre>

        <div id="actions-wrap" hidden>
          <h2 data-i18n="uiActions">Actions</h2>
          <div id="actions" class="actions"></div>
        </div>

        <div id="sources-wrap" hidden>
          <h2 data-i18n="uiSources">Sources</h2>
          <ul id="sources"></ul>
        </div>

        <div id="result-wrap" hidden>
          <h2 data-i18n="uiResult">Result</h2>
          <p id="status" class="muted"></p>
          <div id="result" class="block result markdown-body"></div>
          <p id="error" class="error" hidden></p>
        </div>
      </section>
    </main>

    <script src="defaults.js"></script>
    <script src="vendor/marked.umd.js"></script>
    <script src="vendor/purify.min.js"></script>
    <script src="sidepanel.js"></script>
  </body>
</html>
