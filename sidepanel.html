<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Citepane</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <img src="icons/icon-32.png" width="32" height="32" alt="" />
        <div class="brand-text">
          <h1>
            <span class="brand-cite">Cite</span><span class="brand-pane">pane</span>
          </h1>
        </div>
      </div>
      <div class="top-actions">
        <button
          type="button"
          id="settings-btn"
          class="icon-btn"
          data-i18n-aria="uiSettings"
          aria-label="Settings"
          aria-controls="settings-overlay"
          aria-expanded="false"
        >
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
            <path
              fill="currentColor"
              d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7.2 7.2 0 0 0-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.48.48 0 0 0-.48.41l-.36 2.54c-.59.24-1.13.55-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87a.48.48 0 0 0 .12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.39 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.48-.41l.36-2.54c.59-.24 1.13-.55 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.49.49 0 0 0-.12-.61l-2.03-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"
            />
          </svg>
        </button>
      </div>
    </header>

    <div id="settings-overlay" class="settings-overlay" hidden>
      <button type="button" class="settings-backdrop" id="settings-backdrop" tabindex="-1" aria-label="Close"></button>
      <section
        id="settings-panel"
        class="settings-panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="settings-title"
      >
        <div class="settings-head">
          <h2 id="settings-title" data-i18n="uiSettings">Settings</h2>
          <button
            type="button"
            id="settings-close"
            class="icon-btn settings-close"
            aria-label="Close"
          >
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
              <path
                fill="currentColor"
                d="M18.3 5.71a1 1 0 0 0-1.41 0L12 10.59 7.11 5.7A1 1 0 0 0 5.7 7.11L10.59 12 5.7 16.89a1 1 0 1 0 1.41 1.41L12 13.41l4.89 4.89a1 1 0 0 0 1.41-1.41L13.41 12l4.89-4.89a1 1 0 0 0 0-1.4z"
              />
            </svg>
          </button>
        </div>
        <form id="settings-form">
          <label>
            <span data-i18n="uiBaseUrl">Base URL</span>
            <input id="base-url" name="baseUrl" type="url" required autocomplete="off" />
          </label>
          <label>
            <span data-i18n="uiModel">Model</span>
            <div class="model-row">
              <select id="model" name="model" required></select>
              <button type="button" id="refresh-models" class="ghost compact" data-i18n="uiRefreshModels">
                Refresh
              </button>
            </div>
          </label>
          <label>
            <span data-i18n="uiApiKey">API key (optional)</span>
            <input id="api-key" name="apiKey" type="password" autocomplete="off" />
          </label>
          <div class="settings-grid">
            <label>
              <span data-i18n="uiResponseLanguage">Response language</span>
              <select id="response-language" name="responseLanguage"></select>
            </label>
            <label>
              <span data-i18n="uiUiLanguage">UI language</span>
              <select id="ui-language" name="uiLanguage"></select>
            </label>
          </div>
          <label>
            <span data-i18n="uiTheme">Theme</span>
            <select id="theme" name="theme"></select>
          </label>
          <button type="submit" class="btn-block" data-i18n="uiSave">Save</button>
          <p id="settings-feedback" class="muted" hidden></p>
        </form>
      </section>
    </div>

    <main>
      <div id="idle" class="idle">
        <img class="idle-mark" src="icons/icon-48.png" width="48" height="48" alt="" />
        <p class="idle-title" data-i18n="extName">Citepane</p>
        <p class="muted" data-i18n="uiIdle"></p>
      </div>

      <section id="job" class="job" hidden>
        <p id="action-label" class="eyebrow" hidden></p>
        <div id="status-row" class="status-row" hidden>
          <p id="status" class="status muted"></p>
          <button type="button" id="cancel-btn" class="ghost compact" data-i18n="uiCancel" hidden>
            Cancel
          </button>
        </div>

        <section id="selection-wrap" class="panel-section" hidden>
          <div class="section-head">
            <h2 data-i18n="uiSelection">Selection</h2>
          </div>
          <pre id="selection" class="selection-box"></pre>
        </section>

        <section id="actions-wrap" class="panel-section" hidden>
          <div class="section-head">
            <h2 data-i18n="uiActions">Actions</h2>
          </div>
          <div id="action-tabs" class="action-tabs" role="tablist"></div>
          <div id="actions" class="action-panel" hidden></div>
        </section>

        <section id="sources-wrap" class="panel-section" hidden>
          <div class="section-head">
            <h2 data-i18n="uiSources">Sources</h2>
          </div>
          <ul id="sources" class="sources"></ul>
        </section>

        <section id="result-wrap" class="panel-section result-section" hidden>
          <div class="section-head">
            <h2 data-i18n="uiResult">Result</h2>
            <button type="button" id="copy-btn" class="ghost compact" data-i18n="uiCopy" hidden>
              Copy
            </button>
          </div>
          <div id="result" class="result-box markdown-body"></div>
          <p id="error" class="error" hidden></p>
        </section>
      </section>
    </main>

    <script src="defaults.js"></script>
    <script src="vendor/marked.umd.js"></script>
    <script src="vendor/purify.min.js"></script>
    <script src="sidepanel.js"></script>
  </body>
</html>
